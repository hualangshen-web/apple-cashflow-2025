<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple FY2025 现金流量表</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #000;
    color: #f5f5f7;
    overflow-x: hidden;
  }

  /* ── Scroll Snap ── */
  .snap-wrapper { scroll-snap-type: y proximity; }

  /* ── Hero ── */
  .hero {
    min-height: 100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; position:relative;
    background: radial-gradient(ellipse at 50% 20%, #1a1a30 0%, #000 60%);
    scroll-snap-align: start;
  }
  .hero::after {
    content:''; position:absolute; inset:0;
    background-image: repeating-linear-gradient(0deg,transparent,transparent 1px,rgba(255,255,255,.01) 1px,rgba(255,255,255,.01) 2px);
    pointer-events:none;
  }
  .logo { font-size:120px; animation:logoFloat 3s ease-in-out infinite; }
  @keyframes logoFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  h1 {
    font-size: clamp(3rem,10vw,8rem); font-weight:800; letter-spacing:-.04em;
    background: linear-gradient(135deg,#fff 0%,#a8a8b8 40%,#fff 80%);
    background-size:200% auto;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    animation:titleShine 4s linear infinite;
  }
  @keyframes titleShine { to { background-position:200% center } }
  .subtitle { font-size:clamp(1rem,2vw,1.4rem); color:#86868b; margin-top:12px; font-weight:300; }
  .scrolldown {
    position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
    color:#666; font-size:12px; letter-spacing:.2em; animation:bounce .8s infinite alternate;
  }
  @keyframes bounce { to { transform:translateX(-50%) translateY(8px) } }

  /* ── Metric Cards Grid ── */
  .metric-grid {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:28px; width:min(92%,1300px); margin:60px auto 0; z-index:1; position:relative;
  }
  .card {
    background: rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.06);
    border-radius:28px; padding:40px 32px;
    position:relative; overflow:hidden;
    backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
    transform-style:preserve-3d; transition:transform .15s ease,box-shadow .3s;
    cursor:default;
  }
  .card::before {
    content:''; position:absolute; top:var(--y,50%); left:var(--x,50%);
    width:400px; height:400px;
    background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 60%);
    transform:translate(-50%,-50%); opacity:0; transition:opacity .3s; pointer-events:none;
  }
  .card:hover::before { opacity:1 }
  .card:hover { box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .card-content { position:relative; z-index:1; }
  .card-label { font-size:.85rem; color:#86868b; text-transform:uppercase; letter-spacing:.08em; margin-bottom:16px; }
  .card-value { font-size:clamp(2.2rem,5vw,3.5rem); font-weight:800; margin-bottom:10px; letter-spacing:-.02em; }
  .card-desc { font-size:.95rem; color:#a1a1a6; line-height:1.5; }
  .bar-wrap { margin-top:20px; height:6px; background:rgba(255,255,255,.06); border-radius:3px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:3px; transition:width 1.5s cubic-bezier(.4,0,.2,1); width:0; }

  /* colors */
  .green { color:#30d158 } .green-fill { background:#30d158 }
  .red { color:#ff453a } .red-fill { background:#ff453a }
  .blue { color:#2997ff } .blue-fill { background:#2997ff }
  .gold { color:#ffd700 } .gold-fill { background:linear-gradient(90deg,#ffd700,#ffaa00) }

  /* ── Sankey Section ── */
  .sankey-section {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:100px 5%; position:relative;
    scroll-snap-align: start;
  }
  .section-title {
    font-size:clamp(2rem,5vw,3.5rem); font-weight:700; margin-bottom:60px; text-align:center;
    background:linear-gradient(90deg,#fff,#86868b,#fff); background-size:200% auto;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    animation:titleShine 4s linear infinite;
  }
  #sankey { width:100%; max-width:1200px; height:550px; }

  /* ── Waterfall ── */
  .waterfall {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:100px 24px;
    scroll-snap-align: start;
  }
  .wf-chart { width:min(100%,900px); margin-top:40px; display:flex; flex-direction:column; gap:12px; }
  .wf-bar {
    display:flex; align-items:center; height:52px; position:relative;
    border-radius:12px; overflow:hidden;
  }
  .wf-bar .label { width:160px; font-size:14px; font-weight:600; text-align:right; padding-right:16px; flex-shrink:0; }
  .wf-bar .bar-track { flex:1; height:100%; background:rgba(255,255,255,.03); border-radius:12px; position:relative; }
  .wf-bar .bar-fill-w { height:100%; border-radius:12px; transition:width 2s cubic-bezier(.4,0,.2,1); display:flex; align-items:center; padding-left:16px; }
  .wf-bar .amount { font-weight:800; font-size:18px; position:absolute; right:16px; top:50%; transform:translateY(-50%); color:#fff; }

  /* ── Timeline ── */
  .timeline {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:100px 5%;
    scroll-snap-align: start;
  }
  .tl-track { display:flex; gap:40px; margin-top:60px; flex-wrap:wrap; justify-content:center; }
  .tl-node {
    text-align:center; position:relative; opacity:0; transform:translateY(60px);
    transition:all .8s ease;
  }
  .tl-node.visible { opacity:1; transform:translateY(0) }
  .tl-circle {
    width:80px; height:80px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center; font-size:32px;
    position:relative;
  }
  .tl-circle::after { content:''; position:absolute; inset:-6px; border-radius:50%; border:2px solid currentColor; opacity:.3; animation:ringPulse 2s ease-out infinite; }
  @keyframes ringPulse { 0%{transform:scale(1);opacity:.4} 100%{transform:scale(1.8);opacity:0} }
  .tl-year { font-size:24px; font-weight:800; margin-bottom:4px; }
  .tl-val { font-size:30px; font-weight:800; }
  .tl-desc { font-size:13px; color:#86868b; margin-top:4px; }

  /* ── Particles ── */
  #particles { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }

  /* ── Glow blobs ── */
  .glow { position:fixed; border-radius:50%; filter:blur(120px); opacity:.25; pointer-events:none; z-index:-1; }
  .glow-1 { background:#2997ff; width:500px; height:500px; top:5%; left:-150px; }
  .glow-2 { background:#30d158; width:400px; height:400px; top:40%; right:-150px; }
  .glow-3 { background:#bf5af2; width:450px; height:450px; bottom:5%; left:30%; }

  /* ── Footer ── */
  footer { text-align:center; padding:80px 20px; color:#555; font-size:.85rem; position:relative; z-index:1; border-top:1px solid #1a1a1a; }

  @media (max-width:768px) {
    .metric-grid { grid-template-columns:1fr }
    .wf-bar .label { width:100px; font-size:12px }
    .tl-track { gap:16px }
    .tl-circle { width:60px; height:60px; font-size:24px }
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<div class="snap-wrapper">

<!-- ═══ HERO ═══ -->
<section class="hero">
  <div class="logo"></div>
  <h1>Cash Flow 2025</h1>
  <p class="subtitle">Apple Inc. 财年现金流量全景可视化</p>
  <div class="metric-grid">
    <div class="card" data-tilt>
      <div class="card-content">
        <div class="card-label">🔵 经营活动现金流</div>
        <div class="card-value green" data-animate="118.2" data-prefix="$" data-suffix="B">$0B</div>
        <div class="card-desc">iPhone · 服务 · Mac · iPad 的强劲现金创造</div>
        <div class="bar-wrap"><div class="bar-fill green-fill" data-width="100"></div></div>
      </div>
    </div>
    <div class="card" data-tilt>
      <div class="card-content">
        <div class="card-label">🟡 投资活动现金流</div>
        <div class="card-value blue" data-animate="9.5" data-prefix="+ $" data-suffix="B">+ $0B</div>
        <div class="card-desc">有价证券净到期超过 CapEx 与收购支出</div>
        <div class="bar-wrap"><div class="bar-fill blue-fill" data-width="35"></div></div>
      </div>
    </div>
    <div class="card" data-tilt>
      <div class="card-content">
        <div class="card-label">🔴 融资活动现金流</div>
        <div class="card-value red" data-animate="110.7" data-prefix="− $" data-suffix="B">− $0B</div>
        <div class="card-desc">$95B 股票回购 + $15.7B 分红派息</div>
        <div class="bar-wrap"><div class="bar-fill red-fill" data-width="94"></div></div>
      </div>
    </div>
  </div>
  <div class="scrolldown">⌄ 向下滚动 ⌄</div>
</section>

<!-- ═══ SANKEY ═══ -->
<section class="sankey-section">
  <h2 class="section-title">资金流向全景图</h2>
  <svg id="sankey" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet"></svg>
</section>

<!-- ═══ WATERFALL ═══ -->
<section class="waterfall">
  <h2 class="section-title">瀑布图 · 钱去哪儿了</h2>
  <div class="wf-chart" id="waterfall"></div>
</section>

<!-- ═══ TIMELINE ═══ -->
<section class="timeline">
  <h2 class="section-title">十年现金流趋势</h2>
  <div class="tl-track" id="timeline"></div>
</section>

<footer>
  <p>Made by Timy · 无所吊谓</p>
  <p>数据为 FY2025 近似值 · 仅供演示</p>
</footer>

</div>

<script>
// ── Particles ──
const pCanvas = document.getElementById('particles'), pCtx = pCanvas.getContext('2d');
let particles = [], mouse = {x:0,y:0};
function pResize(){ pCanvas.width=innerWidth; pCanvas.height=innerHeight; }
pResize(); window.addEventListener('resize',pResize);
window.addEventListener('mousemove',e=>{mouse.x=e.x;mouse.y=e.y});

class Particle {
  constructor(){ this.reset(); this.y=Math.random()*pCanvas.height; }
  reset(){ this.x=Math.random()*pCanvas.width; this.y=-10; this.size=.6+Math.random()*2; this.speed=.3+Math.random()*1.2; this.op=.2+Math.random()*.5; }
  update(){
    this.y+=this.speed;
    const dx=mouse.x-this.x,dy=mouse.y-this.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<150){ this.x+=dx*.005; this.y+=dy*.005; }
    if(this.y>pCanvas.height+10) this.reset();
  }
  draw(){
    pCtx.fillStyle=`rgba(255,255,255,${this.op})`;
    pCtx.beginPath(); pCtx.arc(this.x,this.y,this.size,0,Math.PI*2); pCtx.fill();
  }
}
for(let i=0;i<150;i++) particles.push(new Particle());

function animParticles(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(animParticles);
}
animParticles();

// ── Animate numbers ──
function animateValue(el,start,end,dur,prefix='',suffix=''){
  const range=end-start, step=Math.max(Math.abs(Math.floor(dur/range*100)),30);
  let st=Date.now(), et=st+dur, timer;
  function run(){
    let now=Date.now(),rem=Math.max((et-now)/dur,0);
    let v=Math.round(end-(rem*range));
    let txt=v;
    if(end==Math.floor(end)) txt=v.toLocaleString();
    else txt=v.toLocaleString()+'.'+Math.round((end-v)*(end%1?10:0));
    el.textContent=prefix+txt+suffix;
    if(v>=end) clearInterval(timer);
  }
  timer=setInterval(run,step);run();
}

// ── Animate bars ──
function animateBars(){
  document.querySelectorAll('.bar-fill').forEach(b=>{
    const w=parseFloat(b.dataset.width);
    setTimeout(()=>{b.style.width=w+'%';},400+Math.random()*300);
  });
}

// ── Number animation trigger ──
setTimeout(()=>{
  document.querySelectorAll('.card-value[data-animate]').forEach(el=>{
    const v=parseFloat(el.dataset.animate), p=el.dataset.prefix||'', s=el.dataset.suffix||'';
    el.textContent=p+'0'+s;
    animateValue(el,0,v,2000,p,s);
  });
  animateBars();
},600);

// ── 3D Tilt Cards ──
document.querySelectorAll('.card').forEach(card=>{
  card.addEventListener('mousemove',e=>{
    const r=card.getBoundingClientRect();
    let x=e.clientX-r.left, y=e.clientY-r.top;
    card.style.setProperty('--x',x+'px'); card.style.setProperty('--y',y+'px');
    const cx=r.width/2,cy=r.height/2;
    card.style.transform=`perspective(1000px) rotateX(${(y-cy)/10}deg) rotateY(${(cx-x)/10}deg) scale(1.02)`;
  });
  card.addEventListener('mouseleave',()=>{
    card.style.transform='perspective(1000px) rotateX(0) rotateY(0) scale(1)';
  });
});

// ── Sankey ──
(function drawSankey(){
  const svg=document.getElementById('sankey'), ns='http://www.w3.org/2000/svg';
  const nodes=[
    {name:'经营现金流',x:40,y:60,v:118.2,color:'#30d158'},
    {name:'投  资',x:40,y:220,v:9.5,color:'#2997ff'},
    {name:'股票回购',x:720,y:30,v:95,color:'#ff453a'},
    {name:'现金分红',x:720,y:180,v:15.7,color:'#ff9f0a'},
    {name:'资本支出',x:720,y:300,v:10.5,color:'#bf5af2'},
    {name:'债务/其他',x:720,y:400,v:6.5,color:'#5ac8fa'},
  ];
  const links=[
    {s:0,t:2,v:95},{s:0,t:3,v:15.7},{s:0,t:5,v:7.5},{s:1,t:4,v:9.5}
  ];

  // links first (behind)
  links.forEach(l=>{
    const sn=nodes[l.s], tn=nodes[l.t], sh=Math.max(sn.v*2.2,48), th=Math.max(tn.v*2.2,48);
    const x1=sn.x+170, y1=sn.y+sh/2, x2=tn.x, y2=tn.y+th/2;
    const path=document.createElementNS(ns,'path');
    const cpx=x1+(x2-x1)*.6;
    path.setAttribute('d',`M${x1} ${y1} C${cpx} ${y1},${cpx} ${y2},${x2} ${y2}`);
    path.setAttribute('stroke',sn.color);
    path.setAttribute('stroke-width',Math.max(l.v*2.2,8));
    path.setAttribute('fill','none');
    path.setAttribute('opacity','.35');
    path.setAttribute('stroke-linecap','round');
    const len=path.getTotalLength();
    path.style.strokeDasharray=`${len*.25} ${len*.75}`;
    path.style.strokeDashoffset=len;
    path.style.animation=`sankeyFlow ${1.5+Math.random()}s linear infinite`;
    svg.appendChild(path);
  });

  // nodes
  nodes.forEach(n=>{
    const g=document.createElementNS(ns,'g'), h=Math.max(n.v*2.2,48);
    const rect=document.createElementNS(ns,'rect');
    rect.setAttribute('x',n.x);rect.setAttribute('y',n.y);
    rect.setAttribute('width',170);rect.setAttribute('height',h);
    rect.setAttribute('rx',14);rect.setAttribute('fill',n.color);rect.setAttribute('opacity','.85');

    const text=document.createElementNS(ns,'text');
    text.setAttribute('x',n.x+85);text.setAttribute('y',n.y+h/2+5);
    text.setAttribute('text-anchor','middle');text.setAttribute('fill','#000');
    text.setAttribute('font-size','13');text.setAttribute('font-weight','700');
    text.textContent=`${n.name}  $${n.v}B`;
    g.appendChild(rect);g.appendChild(text);svg.appendChild(g);
  });

  const s2=document.createElement('style');
  s2.textContent=`@keyframes sankeyFlow{to{stroke-dashoffset:0}}`;
  document.head.appendChild(s2);
})();

// ── Waterfall ──
(function drawWaterfall(){
  const container=document.getElementById('waterfall');
  const bars=[
    {label:'经营现金流',val:118.2,color:'#30d158'},
    {label:'股票回购',val:-95,color:'#ff453a'},
    {label:'现金分红',val:-15.7,color:'#ff6b35'},
    {label:'CapEx',val:-10.5,color:'#bf5af2'},
    {label:'投资净流入',val:9.5,color:'#2997ff'},
    {label:'债务/其他',val:10.5,color:'#5ac8fa'},
    {label:'净现金增加',val:17,color:'#ffd700',isTotal:true},
  ];

  bars.forEach(bar=>{
    const div=document.createElement('div'); div.className='wf-bar';
    const lbl=document.createElement('div'); lbl.className='label'; lbl.textContent=bar.label;
    const track=document.createElement('div'); track.className='bar-track';
    const fill=document.createElement('div'); fill.className='bar-fill-w';
    fill.style.background=bar.color;
    const amt=document.createElement('div'); amt.className='amount';
    amt.style.color=bar.isTotal?'#ffd700':'#fff';
    amt.textContent=(bar.val>=0?'+':'')+'$'+Math.abs(bar.val)+'B';
    track.appendChild(fill); track.appendChild(amt);
    div.appendChild(lbl); div.appendChild(track);
    container.appendChild(div);

    setTimeout(()=>{
      const maxW=Math.max(...bars.map(b=>Math.abs(b.val)));
      fill.style.width=(Math.abs(bar.val)*1.5/maxW*100)+'%';
    },200);
  });
})();

// ── Timeline ──
(function drawTimeline(){
  const container=document.getElementById('timeline');
  const data=[
    {year:'2016',val:'$65.8B',desc:'现金牛成型'},
    {year:'2018',val:'$77.4B',desc:'服务起飞'},
    {year:'2020',val:'$80.7B',desc:'疫情逆增'},
    {year:'2022',val:'$122.2B',desc:'历史峰值'},
    {year:'2023',val:'$110.5B',desc:'宏观承压'},
    {year:'2025',val:'$118.2B',desc:'王者归来'},
  ];
  const colors=['#30d158','#30d158','#2997ff','#ffd700','#30d158','#ffd700'];

  data.forEach((d,i)=>{
    const div=document.createElement('div'); div.className='tl-node';
    div.innerHTML=`
      <div class="tl-circle" style="color:${colors[i]};background:${colors[i]}15">${i+1}</div>
      <div class="tl-year">FY ${d.year}</div>
      <div class="tl-val" style="color:${colors[i]}">${d.val}</div>
      <div class="tl-desc">${d.desc}</div>
    `;
    div.style.transitionDelay=(i*.15)+'s';
    container.appendChild(div);
  });

  // Intersection Observer to trigger visibility
  const obs2=new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
  },{threshold:.3});
  document.querySelectorAll('.tl-node').forEach(n=>obs2.observe(n));
})();

// ── Glow follows scroll ──
window.addEventListener('scroll',()=>{
  const y=window.scrollY;
  document.querySelector('.glow-1').style.transform=`translateY(${y*.15}px)`;
  document.querySelector('.glow-2').style.transform=`translateY(${-y*.1}px)`;
  document.querySelector('.glow-3').style.transform=`translateY(${-y*.2}px)`;
});

// ── Section title observer ──
const titleObs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting) e.target.style.animation='titleShine 3s linear infinite';
  });
},{threshold:.5});
document.querySelectorAll('.section-title').forEach(t=>titleObs.observe(t));
</script>
</body>
</html>
